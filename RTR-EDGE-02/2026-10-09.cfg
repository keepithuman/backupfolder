!
version 15.9
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
!
hostname RTR-EDGE-02
!
boot-start-marker
boot-end-marker
!
logging buffered 64000 informational
logging console critical
enable secret 9 <REMOVED>
!
aaa new-model
!
aaa group server tacacs+ TACACS-SERVERS
 server name TACACS-01
 server name TACACS-02
 ip tacacs source-interface Loopback0
!
aaa authentication login default group TACACS-SERVERS local
aaa authentication login CONSOLE local
aaa authentication enable default group TACACS-SERVERS enable
aaa authorization console
aaa authorization exec default group TACACS-SERVERS local if-authenticated
aaa authorization commands 15 default group TACACS-SERVERS local if-authenticated
aaa accounting exec default start-stop group TACACS-SERVERS
aaa accounting commands 15 default start-stop group TACACS-SERVERS
!
aaa session-id common
clock timezone EST -5 0
clock summer-time EDT recurring
!
no ip domain lookup
ip domain name corp.example.com
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh source-interface Loopback0
!
username netadmin privilege 15 secret 9 <REMOVED>
!
tacacs server TACACS-01
 address ipv4 10.10.10.21
 key 7 <REMOVED>
tacacs server TACACS-02
 address ipv4 10.10.10.22
 key 7 <REMOVED>
!
interface Loopback0
 description MGMT-LOOPBACK
 ip address 10.255.0.2 255.255.255.255
!
interface GigabitEthernet0/0
 description UPLINK-TO-ISP
 ip address 198.51.100.2 255.255.255.252
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 ip address 10.1.2.1 255.255.255.0
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/2
 description UNUSED
 shutdown
!
router ospf 1
 router-id 10.255.0.2
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.1.2.0 0.0.0.255 area 0
 network 10.255.0.2 0.0.0.0 area 0
!
ip route 0.0.0.0 0.0.0.0 198.51.100.1
no ip http secure-server
!
ip access-list standard MGMT-ACL
 permit 10.10.10.0 0.0.0.255
 deny   any log
!
logging host 10.10.10.50
logging source-interface Loopback0
logging trap informational
!
snmp-server community <REMOVED> RO MGMT-ACL
snmp-server location DC2-Row1-Rack03
snmp-server contact noc@corp.example.com
!
ntp source Loopback0
ntp server 10.10.10.5 prefer
ntp server 10.10.10.6
!
banner motd ^C
***************************************************************
*  AUTHORIZED ACCESS ONLY. All activity is monitored/logged.  *
*  Disconnect immediately if you are not an authorized user.  *
***************************************************************
^C
!
line con 0
 exec-timeout 10 0
 login authentication CONSOLE
 logging synchronous
line vty 0 4
 access-class MGMT-ACL in
 exec-timeout 10 0
 transport input ssh telnet
line vty 5 15
 transport input none
!
end
